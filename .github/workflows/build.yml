# Builds and unit-tests Talkie on a macOS runner and uploads the ad-hoc signed
# app as an artifact. Model downloads are not exercised here; the self-test
# needs ~3 GB of weights and a GPU. Releases are cut locally (scripts/release.sh).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # macOS 26 images ship Xcode 26; MLX needs its Metal compiler.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Ensure Metal Toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Assemble app
        run: TALKIE_SIGN_IDENTITY=- scripts/build-app.sh
      - name: Zip app
        run: |
          source version.env
          echo "MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          /usr/bin/ditto -c -k --keepParent build/Talkie.app "build/Talkie-$MARKETING_VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Talkie-${{ env.MARKETING_VERSION }}
          path: build/Talkie-*.zip
