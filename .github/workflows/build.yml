# Builds and unit-tests Talkie on a macOS runner. Model downloads are not
# exercised here; the self-test needs ~3 GB of weights and a GPU.
name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
      - name: Ensure Metal Toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Assemble app
        run: TALKIE_SIGN_IDENTITY=- scripts/build-app.sh
